# This is supposed to help the entire log4j system reset when reloading this file.
reset=true
status=info

# All our loggers use this pattern.
property.tagged.logging.pattern=%d{HH:mm:ss.SSS} %-5p [%t] %.20c  - %m%n%throwable

## Appenders setup

# Direct log messages to console
appender.console.name = console
appender.console.type = Console
appender.console.Target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${tagged.logging.pattern}
appender.console.immediateFlush=true
## uncomment these lines to control max amount of output that will reach the
## console from WARN and below. useful when working on "noisy" functionality.
# appender.console.filter.burst.type = BurstFilter
# appender.console.filter.burst.level = WARN
# appender.console.filter.burst.rate = 10
# appender.console.filter.burst.maxBurst = 10

# Logging to a file
appender.file.name = file
appender.file.type = RollingFile
appender.file.fileName = ${sys:user.dir}/logs/logging.log
appender.file.filePattern = ${sys:user.dir}/logs/logging-%i.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = ${tagged.logging.pattern}
appender.file.policies.type = Policies
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 100MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 10

rootLogger.level=INFO
rootLogger.appenderRefs = console, file
rootLogger.appenderRef.console.ref = console
rootLogger.appenderRef.file.ref = file

## Standard level settings. please do your best to keep these sorted, unless you
## have a good reason to order them differently.

logger.zk.name=org.apache.zookeeper
logger.zk.level=ERROR

logger.zk-pm.name=org.apache.zookeeper.server.util.JvmPauseMonitor
logger.zk-pm.level=INFO

## Set this to warn so that in local dev we get to see exceptions
logger.rama.name=com.rpl
logger.rama.level=INFO
